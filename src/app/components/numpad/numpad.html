<div class="numpad" [class.compact]="compact()" role="group" aria-label="Zahlenfeld">
  @for (digit of topDigits; track digit) {
    <button type="button" [disabled]="digit > maxDigit()" (click)="this.digit.emit(digit)">
      {{ digit }}
    </button>
  }
  <button type="button" class="erase" aria-label="Löschen" (click)="erase.emit()">⌫</button>
  <button
    type="button"
    class="zero"
    [class.hidden]="!allowZero()"
    [disabled]="!allowZero()"
    (click)="this.digit.emit(0)"
  >
    0
  </button>
  <button
    type="button"
    class="confirm"
    aria-label="Weiter"
    [disabled]="confirmDisabled()"
    (click)="confirm.emit()"
  >
    ✓
  </button>
</div>
